filesystem_size = 196

# Package settings
[packages]
ca-certificates = {}
coreutils = {}
extrautils = {}
ion = {}
pkgutils = {}
kibi = {}
uutils-procps = {}

[[files]]
path = "/usr/lib/init.d/30_console_switch"
data = """
requires_weak 30_console.target
inputd -A 2
"""
