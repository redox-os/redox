[source]
git = "https://github.com/jvalcher/termfu"
rev = "v0.2.2"
[build]
template = "custom"
dependencies = [
    "ncursesw",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
[package]
dependencies = [
    "gdb",
    "python312",
]
