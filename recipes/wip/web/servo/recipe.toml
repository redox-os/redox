[source]
git = "https://gitlab.redox-os.org/redox-os/servo.git"
branch = "redox-0.7.0"

[build]
template = "custom"
dependencies = [
    "expat",
    "fontconfig",
    "freetype2",
    "libpng",
    "mesa",
    "zlib",
]
script = """
DYNAMIC_INIT

cp -v "${COOKBOOK_RECIPE}/.servobuild" "${COOKBOOK_SOURCE}/.servobuild"

# jemalloc specific configuration
export JEMALLOC_SYS_WITH_LG_PAGE=16

if [[ "$REDOXER_USE_CLANG" != "1" && "$REDOXER_USE_CLANG" != "true" ]]; then
    export CC="${GNU_TARGET}-gcc"
    export CXX="${GNU_TARGET}-g++"
    export HOST_CC="gcc"
    export HOST_CXX="g++"
else
    export CC="${GNU_TARGET}-clang"
    export CXX="${GNU_TARGET}-clang++ -stdlib=libstdc++"
    export HOST_CC="clang"
    export HOST_CXX="clang++"
fi
export TARGET_CC="$CC"
export TARGET_CXX="$CXX"
export MOZJS_FROM_SOURCE=1

# pkg-config crate can only recognize one path to pkgconfig
export PKG_CONFIG_PATH_x86_64_unknown_redox="${COOKBOOK_SYSROOT}/lib/pkgconfig"
export PKG_CONFIG_SYSROOT_DIR_x86_64_unknown_redox="${COOKBOOK_SYSROOT}/lib/pkgconfig"
# rsync -a -v ${COOKBOOK_SYSROOT}/usr/share/pkgconfig/*.pc ${COOKBOOK_SYSROOT}/lib/pkgconfig/

#Mozjs specifics
export CCACHE="$CC_WRAPPER"
unset CC_WRAPPER
export CARGO_MAKEFLAGS="-j $COOKBOOK_MAKE_JOBS"

COOKBOOK_CARGO_PATH="ports/servoshell" cookbook_cargo

# resources packaging
mkdir -p "${COOKBOOK_STAGE}/usr/lib/servo/bin" "${COOKBOOK_STAGE}/usr/share/applications"
mv "${COOKBOOK_STAGE}/usr/bin/servoshell" "${COOKBOOK_STAGE}/usr/lib/servo/bin/"
rsync -a -v "${COOKBOOK_SOURCE}/resources" "${COOKBOOK_STAGE}/usr/lib/servo/"
cp "${COOKBOOK_RECIPE}/servo.desktop" "${COOKBOOK_STAGE}/usr/share/applications/servo.desktop"
cp "${COOKBOOK_RECIPE}/servo.sh" "${COOKBOOK_STAGE}/usr/bin/servo"
"""

[package]
dependencies = [
    "mesa"
]
