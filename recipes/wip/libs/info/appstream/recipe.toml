#TODO compiled but not tested
[source]
tar = "https://www.freedesktop.org/software/appstream/releases/AppStream-1.1.2.tar.xz"
script = """
mv AppStream-1.1.2/{*,.*} .
rmdir AppStream-1.1.2
"""
patches = [
    "redox.patch"
]

[build]
template = "meson"
mesonflags = [
    "-Dsystemd=false",
    "-Dgir=false",
    "-Dman=false",
]
dependencies = [
    "glib",
    "libxml2",
    "curl",
    "libfyaml",
    "libxmlb",
    "libstemmer",
    "bash-completion"
]
dev-dependencies = [
    "host:gperf"
]