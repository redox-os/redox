[source]
tar = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.14.tar.xz"
blake3 = "b762a331e48049a648c1bd272b60d1dbf47945af701de0bc3613ed77f4c98327"
script = """
autotools_recursive_regenerate
"""
[build]
template = "configure"
configureflags = [
    "--with-default-trust-store-file=/etc/ssl/certs/ca-certificates.crt",
    "--without-p11-kit",
    "--disable-tests",
    "gl_cv_func_malloc_posix=no",
    "gl_cv_socket_ipv6=no",
]
dependencies = [
    "libbrotli",
    "libgmp",
    "libnettle",
    "libunistring",
    "libtasn1",
    "zlib",
    "zstd",
]
