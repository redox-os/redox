#TODO wayland only
[source]
tar = "https://github.com/freeglut/freeglut/releases/download/v3.8.0/freeglut-3.8.0.tar.gz"
blake3 = "f0f61839c91b633c958afb2bf015f8067cd9fe650fce92cc68ed1a93aad74352"
patches = [
    "redox.patch"
]
[build]
dependencies = [
    "mesa",
    "mesa-glu",
    "libwayland",
    "libxkbcommon",
]
template = "cmake"
cmakeflags = [
    "-DFREEGLUT_WAYLAND=ON",
    "-DFREEGLUT_X11=OFF",
    "-DFREEGLUT_GLES=OFF",
    "-DFREEGLUT_BUILD_DEMOS=OFF",
]

[package]
description = "FreeGLUT (wayland only)"
