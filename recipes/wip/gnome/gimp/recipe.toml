#TODO test more
# build instructions: https://developer.gimp.org/core/setup/build/3.0/INSTALL
# all build options: https://gitlab.gnome.org/GNOME/gimp/-/blob/master/meson_options.txt?ref_type=heads
[source]
tar = "https://download.gimp.org/gimp/v3.2/gimp-3.2.4.tar.xz"
patches = [
    "redox.patch"
]
[build]
template = "custom"
script = """
DYNAMIC_INIT
rsync -a -v ${COOKBOOK_SYSROOT}/usr/share/pkgconfig/*.pc ${COOKBOOK_SYSROOT}/lib/pkgconfig/
COOKBOOK_MESON_FLAGS+=(
    -Denable-default-bin=enabled
    -Denable-console-bin=true
    -Dcheck-update=no
    -Dlibbacktrace=false
    -Dlibunwind=false
    -Dprint=false
    -Dshmem-type=posix
)
cookbook_meson

# plugins causes hang (undo these mv to test)
mv "${COOKBOOK_STAGE}/usr/lib/gimp/3.0/extensions" "${COOKBOOK_STAGE}/usr/lib/gimp/3.0/extensions.disabled"
mv "${COOKBOOK_STAGE}/usr/lib/gimp/3.0/plug-ins" "${COOKBOOK_STAGE}/usr/lib/gimp/3.0/plug-ins.disabled"

# icons are not converted to png (see patches)
HICOLOR="${COOKBOOK_STAGE}/usr/share/icons/hicolor"
for size in 16 32 48 64 256; do
  mkdir -p "${HICOLOR}/${size}x${size}/apps"
  cp -f "${COOKBOOK_RECIPE}/icons/${size}x${size}.png" "${HICOLOR}/${size}x${size}/apps/gimp.png"
done
# TODO: /usr/share/gimp/3.0/images/gimp-splash.png

rm "${COOKBOOK_STAGE}/usr/bin/gimp" # symlink to gimp-3.2
cp "${COOKBOOK_RECIPE}/gimp.desktop" "${COOKBOOK_STAGE}/usr/share/applications/gimp.desktop"
cp "${COOKBOOK_RECIPE}/gimp.sh" "${COOKBOOK_STAGE}/usr/bin/gimp"
"""
dependencies = [
    "appstream",
    "atk",
    "babl",
    "gtk3",
    "gegl",
    "gexiv2",
    "libarchive",
    "liblcms",
    "libmypaint",
    "librsvg",
    "mypaint-brushes",
    "libpoppler",
    "poppler-data",
    "shared-mime-info",
]
dev-dependencies = [
    "host:libxml2"
]
