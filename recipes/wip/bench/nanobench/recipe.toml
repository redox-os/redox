[source]
git = "https://github.com/andreas-abel/nanoBench"
rev = "36c077fd30db11e8c83cedfcb58daa505d1d0b12"
shallow_clone = true
[build]
template = "custom"
[package]
dependencies = [
    "python312",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" user -j "${COOKBOOK_MAKE_JOBS}"
"""
