# https://aflplus.plus/building/
# https://github.com/AFLplusplus/AFLplusplus/blob/stable/docs/INSTALL.md # has feature flags
[source]
git = "https://github.com/AFLplusplus/AFLplusplus"
rev = "v5.00c"
shallow_clone = true
[build]
template = "custom"
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" distrib -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
