# build instructions: https://git.zx2c4.com/wireguard-tools/tree/README.md
[source]
tar = "https://git.zx2c4.com/wireguard-tools/snapshot/wireguard-tools-1.0.20260223.tar.xz"
[build]
template = "custom"
[package]
dependencies = [
    "wireguard-rs",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/src" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
