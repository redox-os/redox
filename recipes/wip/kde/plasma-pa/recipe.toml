[source]
git = "https://invent.kde.org/plasma/plasma-pa"
rev = "v6.6.5"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DBUILD_DOC=OFF"
]
dev-dependencies = ["host:ecm"]
dependencies = [
    "qt6-base",
    "libplasma",
    "libcanberra",
    "pulseaudio-qt",
    "libpulse",
]
