#TODO glfw dependency can't find timerfd function
[source]
git = "https://github.com/erincatto/box2d"
rev = "v3.1.1"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DBUILD_SHARED_LIBS=ON",
    "-DBOX2D_BENCHMARKS=ON",
    "-DBOX2D_VALIDATE=OFF",
    "-DBOX2D_UNIT_TESTS=OFF",
]
dependencies = [
    "libwayland",
    "libxkbcommon",
    "libx11",
    "libxrandr",
    "libxinerama",
    "libxcursor",
    "libxi",
]
