# build instructions: https://github.com/official-stockfish/Stockfish/wiki/Compiling-from-source
[source]
git = "https://github.com/official-stockfish/Stockfish"
rev = "sf_19"
shallow_clone = true
[build]
template = "custom"
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/src" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" build -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
