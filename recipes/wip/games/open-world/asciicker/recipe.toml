# Y9 version have unnecessary v8 JS dependency
#TODO build and test
# build script: https://github.com/msokalski/asciicker/blob/y8/build.sh
[source]
git = "https://github.com/msokalski/asciicker"
rev = "Y8"
shallow_clone = true
[build]
template = "custom"
dependencies = [
    "mesa",
    "libx11",
    "libxinerama",
    "libgpm",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f makefile_asciiid
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f makefile_server
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f makefile_game
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}" -f makefile_game_term
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr" -f makefile_asciiid
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr" -f makefile_server
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr" -f makefile_game
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr" -f makefile_game_term
"""
