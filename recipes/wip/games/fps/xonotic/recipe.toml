# build instructions: https://gitlab.com/xonotic/xonotic/-/wikis/Compiling
[source]
tar = "https://gitlab.com/xonotic/xonotic/-/archive/xonotic-v0.8.6/xonotic-xonotic-v0.8.6.tar.bz2"
[build]
template = "custom"
dependencies = [
    "libgmp",
    "sdl2",
    "libjpeg",
    "libpng",
    "freetype2",
    "libogg",
    "libvorbis",
    "curl",
    "rsync",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
