[source]
git = "https://git.sr.ht/~sircmpwn/wev"
rev = "1.1.0"
shallow_clone = true
[build]
template = "custom"
dependencies = [
    "libwayland",
    "libxkbcommon",
]
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
"${COOKBOOK_MAKE}" -j "${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" install DESTDIR="${COOKBOOK_STAGE}/usr"
"""
