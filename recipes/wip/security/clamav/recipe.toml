#TODO try to disable libcheck?
# build instructions: https://docs.clamav.net/manual/Installing/Installing-from-source-Unix.html
[source]
tar = "https://www.clamav.net/downloads/production/clamav-1.5.4.tar.gz"
[build]
template = "cmake"
cmakeflags = [
    "-DENABLE_MILTER_DEFAULT=OFF",
    "-DENABLE_TESTS_DEFAULT=OFF",
    "-DENABLE_MAN_PAGES_DEFAULT=OFF",
    "-DENABLE_UNRAR_DEFAULT=OFF",
    "-DENABLE_SYSTEMD_DEFAULT=OFF",
]
dependencies = [
    "curl",
    "ncursesw",
    "bzip2",
    "json-c",
    "pcre",
    "openssl3",
    "libxml2",
    "zlib",
]
