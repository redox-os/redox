[source]
git = "https://github.com/Patater/demokit"
rev = "5304bab243573c5aa09fb5c98fe34dff98f59675"
shallow_clone = true
patches = ["redox.patch"]
[build]
template = "custom"
dependencies = ["sdl2"]
dev-dependencies = ["libstdcxx"]
script = """
DYNAMIC_INIT
export PATH="$COOKBOOK_RECIPE:$PATH"
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
"${COOKBOOK_MAKE}" all -j "${COOKBOOK_MAKE_JOBS}"

mkdir -p "$COOKBOOK_STAGE/usr/bin"
for bin in "fire" "plasma" "stars" "tunnel"
do
    cp ./$bin/$bin "$COOKBOOK_STAGE/usr/bin/stars-sdl_$bin"
done
"""
