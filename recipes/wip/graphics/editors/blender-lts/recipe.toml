# build instructions: https://developer.blender.org/docs/handbook/building_blender/
[source]
git = "https://projects.blender.org/blender/blender"
branch = "blender-v4.5-release"
shallow_clone = true
[build]
template = "cmake"
cmakeflags = [
    "-DWITH_GHOST_SDL=ON",
    "-DWITH_SDL=ON",
    "-DWITH_EXPERIMENTAL_FEATURES=OFF",
    "-DWITH_VULKAN_BACKEND=OFF",
    "-DWITH_INTERNATIONAL=OFF",
    "-DWITH_PYTHON=OFF",
    "-DWITH_LIBS_PRECOMPILED=OFF",
]
dependencies = [
#     "dbus",
#     "libdecor",
     "libjpeg",
     "libpng",
     "zlib",
     "libtiff",
     "openimageio",
#     "libvulkan",
     "freetype2",
#     "fontconfig",
     "zstd",
#     "bzip2",
#     "xz",
     "sdl2",
     "libepoxy",
#     "shaderc",
#     "libxml2",
#     "libharu",
#     "mesa-x11",
#     "libxkbcommon",
]
