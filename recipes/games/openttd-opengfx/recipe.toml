[source]
git = "https://gitlab.redox-os.org/redox-os/openttd-opengfx.git"
shallow_clone = true
[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/opengfx"
cp -Rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/opengfx"
"""
