[package]
description = "Libre sound effect assets for OpenTTD"

[source]
git = "https://gitlab.redox-os.org/redox-os/openttd-opensfx.git"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/opensfx"
cp -Rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/opensfx"
"""
