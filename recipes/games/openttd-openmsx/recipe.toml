[package]
description = "Libre music assets for OpenTTD"

[source]
git = "https://gitlab.redox-os.org/redox-os/openttd-openmsx.git"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/openmsx"
cp -Rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/usr/share/games/openttd/baseset/openmsx"
"""