[package]
description = "Tools and libraries for network video streaming"

[source]
tar = "https://gitlab.freedesktop.org/gstreamer/gstreamer/-/archive/1.28.9/gstreamer-1.28.9.tar.gz"
blake3 = "1bb4db127c0b5b87e64c3be700b4f917e2445db8a90b64b44715baa6f7dbd9bb"
patches = ["redox.patch"]

[build]
template = "custom"
dependencies = [
    "bzip2",
    "curl",
    "ffmpeg6",
    "gdk-pixbuf",
    "libass",
    "libffi",
    "libmodplug1",
    "libnettle",
    "libsndfile",
    "libsoup",
    "libwebp",
    "mesa",
    "libfdk-aac",
    #TODO: "openal",
    "pango",
]
script = """
DYNAMIC_INIT

export GLIB_GENMARSHAL="$(which glib-genmarshal)"
export GLIB_MKENUMS="$(which glib-mkenums)"

CFLAGS="${CFLAGS} -DM_LN2=0.69314718055994530942"
cookbook_meson \
    -Ddevtools=disabled \
    -Dexamples=disabled \
    -Dlibav=enabled \
    -Dlibnice=disabled \
    -Dorc=disabled \
    -Dtests=disabled \
    -Dtools=enabled \
    -Dgstreamer:check=disabled \
    -Dgstreamer:coretracers=disabled \
    -Dgst-plugins-bad:shm=disabled \
    -Dgst-plugins-base:xshm=disabled \
    -Dgst-plugins-good:ximagesrc-xshm=disabled
"""
