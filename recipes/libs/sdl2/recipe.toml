[package]
description = "Simple Directmedia Layer library (API version 2.x)"

[source]
git = "https://gitlab.redox-os.org/redox-os/sdl2.git"
branch = "redox-2.0.33"
shallow_clone = true

[build]
template = "cmake"
dependencies = [
    "liborbital",
    "mesa",
    "zlib",
]
cmakeflags = [
    "-DSDL_VIDEO=1",
    "-DSDL_ORBITAL=1",
    "-DREDOX=1",
]
