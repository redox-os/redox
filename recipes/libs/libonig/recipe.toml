[source]
git = "https://github.com/kkos/oniguruma"
rev = "f95747b462de672b6f8dbdeb478245ddf061ca53"
shallow_clone = true
script = """
autotools_recursive_regenerate
"""
[build]
template = "custom"
script = """
DYNAMIC_INIT
cookbook_configure
if [ "${COOKBOOK_DYNAMIC}" = "1" ]; then
# TODO: fini arrays causes hang in uutils
${OBJCOPY} --remove-section=.fini_array --remove-section=.fini ${COOKBOOK_STAGE}/usr/lib/libonig.so.5
fi
"""
