[source]
tar = "https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.8.2.tar.gz"
blake3 = "5f762fe9c3f762ebcd999c657041490daed913e7ff7eca0e305856c598f5a7f1"

[build]
template = "cmake"
dependencies = [
  "sdl2",
  "libogg",
  "libvorbis",
  "opusfile",
  "libxmp",
  "wavpack",
]
dev-dependencies = [
  "libstdcxx"
]
cmakeflags = [
  "-DSDL2MIXER_MIDI=OFF", # fluidsynth
]
