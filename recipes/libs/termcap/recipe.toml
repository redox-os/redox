[package]
description = "GNU library for rich terminal interfaces"

[source]
tar = "https://ftp.gnu.org/gnu/termcap/termcap-1.3.1.tar.gz"
blake3 = "57c095e0bb6e60e7b4a0597f51f7ac15b501ca0f95d37424d8d13978d28b8da3"
patches = [
    "redox.patch"
]
[build]
template = "custom"
compiler = "no-lto"
script = """
DYNAMIC_STATIC_INIT
export ac_cv_header_stdc=yes
COOKBOOK_CONFIGURE_FLAGS+=(
    --prefix="${COOKBOOK_STAGE}/usr"
    --enable-install-termcap
    --with-termcap="${COOKBOOK_STAGE}/etc/termcap"
)
COOKBOOK_MAKE_FLAGS=(
    infodir="$COOKBOOK_STAGE/usr/share/info"
)
# termcap only emit static object
export CC+=" -fPIC"
mkdir -p "${COOKBOOK_STAGE}/etc"
cookbook_configure
"""
