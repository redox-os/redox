[source]
git = "https://github.com/pop-os/cosmic-text.git"
branch = "main"

[build]
template = "custom"
dependencies = [
    "libonig",
]
script = """
DYNAMIC_INIT
export RUSTONIG_DYNAMIC_LIBONIG=1
COOKBOOK_CARGO_FLAGS=() # remove --locked
COOKBOOK_CARGO_PATH=examples/editor cookbook_cargo_build
"""

[package]
dependencies = [
    "libxkbcommon",
]
