[source]
git = "https://github.com/WebAssembly/wasi-testsuite"
branch = "prod/testsuite-base"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/wasi-testsuite"
cp -rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/usr/share/wasi-testsuite"
"""

[package]
dependencies = [
  "python312",
  "python3-colorama",
  "python3-requests",
]
