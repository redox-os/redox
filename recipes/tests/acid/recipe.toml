[source]
git = "https://gitlab.redox-os.org/redox-os/acid.git"
shallow_clone = true
[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/acid"
cp -rv "${COOKBOOK_SOURCE}"/* "${COOKBOOK_STAGE}/usr/share/acid"

# Create runner script
mkdir -p "${COOKBOOK_STAGE}/usr/bin"
cat > "${COOKBOOK_STAGE}/usr/bin/acid-runner" <<EOF
#!/usr/bin/ion
set -e
mkdir -p ~/.cache/acid
cargo test --manifest-path /usr/share/acid/Cargo.toml --target-dir ~/.cache/acid
EOF

chmod +x "${COOKBOOK_STAGE}/usr/bin/acid-runner"

"""
[package]
dependencies = ["rust"]
