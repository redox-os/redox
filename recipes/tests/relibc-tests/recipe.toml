[source]
same_as = "../../core/relibc"

[build]
template = "custom"
script = """
mkdir -pv "${COOKBOOK_STAGE}/usr/share/relibc-tests"
cp -rv "${COOKBOOK_SOURCE}/tests" "${COOKBOOK_STAGE}/usr/share/relibc-tests"
"""

[package]
description = "Redox POSIX/C Standard Library Test Suite"
dependencies = ["gcc13"]
