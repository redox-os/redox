[package]
description = "Tools for working with shared libraries"

#TODO can build, not tested
[source]
tar = "https://ftp.gnu.org/gnu/libtool/libtool-2.6.2.tar.gz"
blake3 = "0d046e6c2b7ad8253b7420db02f616de004f7eb8ea16446840e070fba9904a65"

patches = [
    "redox.patch"
]

[build]
template = "custom"
script = """
DYNAMIC_INIT

# libtool saves absolute path to sysroot which contains nothing
unset CFLAGS

cp -r "${COOKBOOK_SOURCE}"/. ./
COOKBOOK_CONFIGURE="./configure"
cookbook_configure
"""
