[source]
tar = "https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz"
blake3 = "596b02fea3d67e2ca45208aabebc92d2c14e7f2827f82cba59a630d55eea0854"

[build]
dependencies=[
    "curl",
    "expat",
    "zlib",
    "pcre2",
]
template = "custom"
script = """
rsync -av --delete "${COOKBOOK_SOURCE}/" ./
DYNAMIC_INIT
MAKEFLAGS=(
    NEEDS_SSL_WITH_CURL=1
    NEEDS_CRYPTO_WITH_SSL=1
    NO_IPV6=1 # not implemented
    NO_MMAP=1 # mmap writes extra null padding
    NO_SETITIMER=1 # deprecated
    NO_UNIX_SOCKETS=1 # need inotify
    NEEDS_LIBICONV=
    NEEDS_LIBRT=
    BLK_SHA1=1
    RUST_TARGETS=$TARGET
    INSTALL_SYMLINKS=1
)

export CURL_CONFIG="${COOKBOOK_SYSROOT}/usr/bin/curl-config"
./configure \
    --host="${GNU_TARGET}" \
    --prefix=/usr \
    --sysconfdir=/etc \
    ac_cv_fread_reads_directories=yes \
    ac_cv_snprintf_returns_bogus=yes \
    ac_cv_lib_curl_curl_global_init=yes
"${COOKBOOK_MAKE}" "${MAKEFLAGS[@]}" -j"${COOKBOOK_MAKE_JOBS}"
"${COOKBOOK_MAKE}" DESTDIR="${COOKBOOK_STAGE}" "${MAKEFLAGS[@]}" install

# TODO: pinned to protocol v0 otherwise silently quit
mkdir -p "${COOKBOOK_STAGE}/etc"
cp "${COOKBOOK_RECIPE}/gitconfig" "${COOKBOOK_STAGE}/etc/"
"""

[package]
description = "Distributed version control system"
dependencies = [
    "ca-certificates",
]
