[llvm]
download-ci-llvm = false
static-libstdcpp = false
link-shared = true

[build]
host = ["COOKBOOK_TARGET"]
target = ["COOKBOOK_TARGET"]
submodules = false
docs = false
tools = ["cargo", "cargo-miri", "clippy", "miri", "rustdoc", "rustfmt", "src"]
extended = true
verbose = 1

[install]
prefix = "install"
sysconfdir = "etc"

[rust]
backtrace = false
codegen-tests = false
lto = "COOKBOOK_LTO_MODE"

[target.COOKBOOK_TARGET]
cc = "CC"
cxx = "CXX"
ar = "AR"
linker = "CC"
crt-static = false
llvm-config = "COOKBOOK_SYSROOT/bin/llvm-config"

[target.aarch64-unknown-linux-gnu]
llvm-config = "COOKBOOK_TOOLCHAIN/bin/llvm-config"

[target.x86_64-unknown-linux-gnu]
llvm-config = "COOKBOOK_TOOLCHAIN/bin/llvm-config"
