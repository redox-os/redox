[package]
description = "The Redox microkernel"

[source]
git = "https://gitlab.redox-os.org/redox-os/kernel.git"

[build]
template = "custom"
script = """
COOKBOOK_NOSTRIP=1
cd "${COOKBOOK_SOURCE}"
make install BUILD="${COOKBOOK_BUILD}" DESTDIR="${COOKBOOK_STAGE}"
"""

[[optional-packages]]
name = "dev"
dependencies = []
files = [
    "usr/lib/boot/kernel.sym",
    "usr/lib/boot/kernel.all",
]
